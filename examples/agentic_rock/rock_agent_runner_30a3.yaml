hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "terminal_master_test"
seed: 42

logging_dir: ./output/logs
output_dir: ./output
model_name: ${exp_name}-${now:%Y%m%d_%H%M%S}
rollout_dump_dir: odps://tisplus_dev/tables/agent_native_swe_examples/ds=${model_name}

track_with: ml_tracker
tracker_kwargs:
 project: roll_pipeline_native_exp
 notes: "Code"
 tags:
   - pipeline
   - roll

# checkpoint_config:
#   type: mos

async_generation_ratio: 1
pretrain: Qwen/Qwen3-Coder-30B-A3B-Instruct
reward_pretrain: Qwen/Qwen3-Coder-30B-A3B-Instruct


parse_tool_call_parameter_to_dict: true

rpc_timeout: 72000
max_steps: 2048
logging_steps: 1

resume_from_checkpoint: false

rollout_batch_size: 32
val_batch_size: 32

LEN_16k: 16384
LEN_32k: 32768
LEN_64k: 65536
LEN_128k: 131072
LEN_256k: 262144

sequence_length: ${LEN_64k}
max_tokens_per_step: 4096

# Here, you can override variables defined in the imported envs. max_tokens_per_step: 128 in custom_env.SimpleSokoban, here replaced by 64
advantage_clip: 20
ppo_epochs: 1
adv_estimator: "step_reinforce"
batch_adjust_mode: "random_sample"
# batch_adjust_mode: "copy"
step_reward_gamma: 1.0
use_sequence_packing: false

init_kl_coef: 0.0
whiten_advantages: false
entropy_loss_coef: 0
max_grad_norm: 1.0
#pg_clip: 0.1
#dual_clip_loss: True

system_envs:
  VLLM_FLASH_ATTN_VERSION: '2'
  PROXY_ROUTER_TYPE: 'ingress'
  EP_ENDPOINT: ''
  # set your own values here if using "alb"
  ALB_VPC_ID: ''
  ALB_LOAD_BALANCER_IDS: ''
  ALB_LOAD_BALANCER_LSN_IDS: ''
  ALB_ENDPOINT: ''
  ALIBABA_CLOUD_ACCESS_KEY_ID: ''
  ALIBABA_CLOUD_ACCESS_KEY_SECRET: ''
  ALB_RESOURCE_CLEAN_DIR: ''
  ALB_RESOURCE_GROUP_ID: ''
  ALB_REGION: ''
  ALB_LISTEN_PORT: ''
  # oss config
  OSS_ACCESS_KEY_ID: ''
  OSS_ACCESS_KEY_SECRET: ''
  OSS_REGION: ''
  OSS_ENDPOINT: ''
  OSS_BUCKET: ''
  OSS_DATASET_PATH: ''

actor_train:
  system_envs:
    NVTE_FLASH_ATTN: '1'
    NVTE_FUSED_ATTN: '0'
    NVTE_UNFUSED_ATTN: '0'
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: false  # 保持启用梯度检查点
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 3.0e-6
    weight_decay: 0.0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 32
    warmup_steps: 5
    lr_scheduler_type: linear
  data_args:
    template: qwen3_coder
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      tensor_model_parallel_size: 1
      sequence_parallel: true
      pipeline_model_parallel_size: 2
      virtual_pipeline_model_parallel_size: 8
      overlap_grad_reduce: true
      expert_model_parallel_size: 8
      context_parallel_size: 8
      recompute_granularity: selective
      recompute_modules: "moe,layernorm"
      use_distributed_optimizer: true
      moe_token_dispatcher_type: "alltoall"
      moe_grouped_gemm: true
      apply_rope_fusion: true
      bias_activation_fusion: true
      additional_configs:
        moe_permute_fusion: true
  device_mapping: list(range(0,32))
  infer_batch_size: 1
  use_dynamic_batching_in_train: true
  max_tokens_per_microbatch_in_train: ${LEN_64k}
  sequence_length_round_in_train: 128
  use_dynamic_batching_in_infer: true
  max_tokens_per_microbatch_in_infer: ${LEN_64k}
  sequence_length_round_in_infer: 128
  logits_in_fp32: false
actor_infer:
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: ${max_tokens_per_step} # single-turn response length
    top_p: 1.0
    top_k: 50
    num_beams: 1
    temperature: 1.0
    num_return_sequences: 1
    stop_strings: ["</tool_call>","</tool_call>\n","\n</tool_call>\n","\n</function>"]
    include_stop_str_in_output: true
  data_args:
    template: qwen3_coder
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.85
      block_size: 16
#      load_format: auto
      tensor_parallel_size: 4
  device_mapping: list(range(32,48))

reference:
  model_args:
    attn_implementation: fa2
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  data_args:
    template: qwen3_coder
  strategy_args:
    strategy_name: megatron_infer
    strategy_config:
      tensor_model_parallel_size: 1
      sequence_parallel: true
      pipeline_model_parallel_size: 2
      virtual_pipeline_model_parallel_size: 8
      expert_model_parallel_size: 8
      context_parallel_size: 8
      use_distributed_optimizer: true
      moe_token_dispatcher_type: "alltoall"
      moe_grouped_gemm: true
      additional_configs:
        moe_permute_fusion: true
  device_mapping: list(range(0,32))
  infer_batch_size: 1
  use_dynamic_batching_in_train: true
  max_tokens_per_microbatch_in_train: ${LEN_64k}
  sequence_length_round_in_train: 128
  use_dynamic_batching_in_infer: true
  max_tokens_per_microbatch_in_infer: ${LEN_64k}
  sequence_length_round_in_infer: 128
  logits_in_fp32: false


reward_normalization:
  grouping: traj_group_id
  method: identity
#  norm_mean_type: group
#  norm_std_type: batch

train_env_manager:
  num_env_groups: 32
  # under the same group, the env config and env seed are ensured to be equal
  group_size: 1
  tags: [RockNativeEnv]
  num_groups_partition: [32]  # If not set, all env names divide nums equally. Under the same group, the env config and env seed (prompt) are equal in each generation

val_env_manager:
  num_env_groups: 32
  group_size: 1
  tags: [RockNativeEnv]
  num_groups_partition: [32]

max_actions_per_traj: 200

custom_envs:
  RockNativeEnv:
    env_type: rocknative
    max_steps: ${max_actions_per_traj}
    max_tokens_per_step: ${max_tokens_per_step}
    env_manager_cls: roll.pipeline.agentic.env_manager.proxy_env_manager.ProxyEnvManager
    agent_runner_cls: roll.pipeline.agentic.agent_runner.rock.push_runner.PushModeRunner  # push（默认）: agent 经 ingress/ALB 回调 Roll；pull: Roll 主动轮询沙箱
    env_config:
      dataset_name: data/swe_bench_test.jsonl
      max_iterations: ${max_actions_per_traj}
      tool_call_parser: qwen3_coder
      trajectory_mode: traj
      reward_granularity: pass_rate      # pass_rate（默认）: 读 report.json 取 FAIL_TO_PASS 通过率（P2P 回归判0）；binary: 用 verifier 原始 0/1 reward
      task_timeout_sec: 5400      # agent 单任务超时（秒），默认 300 太短
      # model_service_port: 28080   # Pull 模式专用：ModelService 监听端口（避开沙箱占用的 8080）
