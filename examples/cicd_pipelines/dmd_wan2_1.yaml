# CICD regression config for DMD distillation on Wan2.1-T2V-1.3B (video diffusion).
# Derived from examples/wan2_1-1.3B_dmd/dmd_config.yaml.
# Runs via start_dmd_pipeline.py (pytorch2100 + requirements_diffusion.txt), 4 GPUs colocated.
hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "wan2_1-1.3B-dmd"
seed: 42
full_determinism: false
logging_dir: ./output/logs
output_dir: ./output/dmd_shell

system_envs:
  USE_MODELSCOPE: '1'

checkpoint_config:
  type: file_system
  output_dir: ./output/dmd_shell/ckpt
  async_upload: true
  keep_local_file: false

track_with: ml_tracker
tracker_kwargs:
 project: roll_pipeline_cicd # ml_tracker的实验名，
 notes: "roll v0.4 dmd distillation regression"
 tags: # mltracker job tags，后续方便管理实验
   - pipeline
   - roll
   - cicd
   - wan2_1_dmd

max_steps: 100
save_steps: 50
checkpoint_steps: []
checkpoint_roles: [generator, fake_score]
parallel_checkpoint_roles: false
logging_steps: 1
resume_from_checkpoint: false
max_grad_norm: 10.0
share_prompt_embeddings: true
gpu_tensor_transfer: true
is_offload_optimizer_states_in_train_step: true

num_nodes: 1
num_gpus_per_node: 4

pretrain: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
diffusion_model_variant: wan2_1

timestep_shift: 5.0

denoising:
  step_list: [1000, 750, 500, 250]
  warp_step: true

sample:
  num_frames: 81
  height: 480
  width: 832

score_timestep:
  num_train_timestep: 1000
  min_score_timestep: 0
  sample_shift: 5.0

guidance:
  scale: 3.0
  negative_prompt: >-
    色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，
    整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，
    画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，
    手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走

ddmd:
  enabled: false
  gradient_scale: 1.0

dfake_gen_update_ratio: 5

ema:
  enabled: false
  weight: 0.99
  start_step: 200
  update_interval: 1

generator:
  model_args:
    dtype: bf16
    attn_implementation: fa2
    disable_gradient_checkpointing: false
  data_args:
    file_name: data/dmd_wan2_1_cicd_prompts.txt
    dataset_type: text
  training_args:
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 1
    learning_rate: 2.0e-6
    lr_scheduler_type: constant
    adam_beta1: 0.0
    adam_beta2: 0.999
    weight_decay: 0.01
    num_train_epochs: 1
  strategy_args:
    strategy_name: veomni_train
    strategy_config:
      mixed_precision: true
      param_dtype: bfloat16
      reduce_dtype: float32
      reshard_after_forward: true
      ulysses_parallel_size: 2
  device_mapping: "[0,1,2,3]"
  infer_batch_size: 1

fake_score:
  model_args:
    dtype: bf16
    attn_implementation: fa2
    disable_gradient_checkpointing: false
  training_args:
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 1
    learning_rate: 4.0e-7
    lr_scheduler_type: constant
    adam_beta1: 0.0
    adam_beta2: 0.999
    weight_decay: 0.01
    num_train_epochs: 1
  strategy_args:
    strategy_name: veomni_train
    strategy_config:
      mixed_precision: true
      param_dtype: bfloat16
      reduce_dtype: float32
      reshard_after_forward: true
      ulysses_parallel_size: 2
  device_mapping: "[0,1,2,3]"
  infer_batch_size: 1

real_score:
  model_args:
    dtype: bf16
    attn_implementation: fa2
    disable_gradient_checkpointing: true
  strategy_args:
    strategy_name: veomni_infer
    strategy_config:
      mixed_precision: false
      reshard_after_forward: true
      ulysses_parallel_size: 2
  device_mapping: "[0,1,2,3]"
  infer_batch_size: 1
