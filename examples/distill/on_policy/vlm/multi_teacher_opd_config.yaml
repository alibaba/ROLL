hydra:
  run:
    dir: .
  output_subdir: null

# Pure OPD mode: uses start_onpolicy_distill_pipeline.py launcher
pure_opd_pipeline_type: rlvr_vlm

# Global Config
exp_name: "qwen3-vl-4B-opd-single-teacher"
output_dir: ./output/
logging_dir: ./output/logs
rollout_dump_dir: ./output/rollout_dump
seed: 42
system_envs:
  USE_MODELSCOPE: '1'
  VLLM_USE_FLASHINFER_SAMPLER: '0'

checkpoint_config:
  type: mos

track_with: tensorboard
tracker_kwargs:
  log_dir: ./output

num_nodes: 1
num_gpus_per_node: 8

max_steps: 300
save_steps: 50
logging_steps: 1
eval_steps: 10
resume_from_checkpoint: false

rollout_batch_size: 128  # prompt
prompt_length: 2048
response_length: 4096

num_return_sequences_in_group: 1
ppo_epochs: 1
# Student: initial Qwen3-VL-4B-Thinking (before GRPO)
pretrain: Qwen/Qwen3-VL-4B-Thinking
reward_pretrain: Qwen/Qwen3-VL-4B-Thinking

# Teacher: train math and cv teachers (e.g. via GRPO) before running OPD.
teacher_model_math: Qwen/Qwen3-VL-4B-Thinking
teacher_model_cv: Qwen/Qwen3-VL-4B-Thinking

validation:
  data_args:
    file_name:
      - path/to/Orsta-Data-47k/test/test_math_megabench_237.parquet
      - path/to/Orsta-Data-47k/test/test_detection_coco_test_multi_2000.parquet
    dataset_dir: ./
    preprocessing_num_workers: 32
    image_max_pixels: 1048576  # 1024 * 1024
  generating_args:
    max_new_tokens: ${response_length}
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: 1
  eval_steps: ${eval_steps}

student_train:
  model_args:
    model_name_or_path: ${pretrain}
    attn_implementation: fa2
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
    freeze_module_prefix: vision_model
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 1.0e-2
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    warmup_steps: 0
    num_train_epochs: 50
  data_args:
    file_name:
      - path/to/Orsta-Data-47k/train/train_detection_v3det_4000.parquet
      - path/to/Orsta-Data-47k/train/train_math_mmmath_3539.parquet
    domain_interleave_probs:
      math: 0.5
      cv_detection: 0.5
    dataset_dir: ./
    messages: prompt
    preprocessing_num_workers: 32
    image_max_pixels: 1048576  # 1024 * 1024
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      sequence_parallel: true
      tensor_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      overlap_grad_reduce: true
      use_distributed_optimizer: true
      recompute_granularity: full
      bf16: true
  device_mapping: list(range(0,16))
  infer_batch_size: 2

student_infer:
  model_args:
    model_name_or_path: ${pretrain}
    attn_implementation: fa2
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: ${response_length}
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: ${num_return_sequences_in_group}
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.7
      block_size: 16
      enable_prefix_caching: false
      enforce_eager: true
      sleep_level: 2
  num_gpus_per_worker: 1
  device_mapping: list(range(0,16))
  infer_batch_size: 32

# teacher_math handles math data, teacher_cv handles detection data
teacher:
  teacher_math:
    model_args:
      model_name_or_path: ${teacher_model_math}
      attn_implementation: fa2
      disable_gradient_checkpointing: true
      dtype: bf16
      model_type: ~
    strategy_args:
      strategy_name: megatron_infer
      strategy_config:
        sequence_parallel: true
        tensor_model_parallel_size: 1
        context_parallel_size: 1
        pipeline_model_parallel_size: 1
        expert_model_parallel_size: 1
        bf16: true
    device_mapping: list(range(0,8))
    infer_batch_size: 8
    opd_kl_coef: 1.0
    tag_included: [mm_math, megabench_math]

  teacher_cv:
    model_args:
      model_name_or_path: ${teacher_model_cv}
      attn_implementation: fa2
      disable_gradient_checkpointing: true
      dtype: bf16
      model_type: ~
    strategy_args:
      strategy_name: megatron_infer
      strategy_config:
        sequence_parallel: true
        tensor_model_parallel_size: 1
        context_parallel_size: 1
        pipeline_model_parallel_size: 1
        expert_model_parallel_size: 1
        bf16: true
    device_mapping: list(range(0,8))
    infer_batch_size: 8
    opd_kl_coef: 1.0
    tag_included: [v3det_train, object365_train, coco_val_multi_test]

# Reward workers: in pure OPD mode, rewards are for validation and monitoring only
# (training signal comes from Teacher KL)
rewards:
  math:
    worker_cls: roll.pipeline.rlvr.rewards.math_rule_reward_worker.MathRuleRewardWorker
    model_args:
      model_name_or_path: ${reward_pretrain}
    tag_included: [mm_math, megabench_math]
    world_size: 16
    infer_batch_size: 1
  cv_detection:
    worker_cls: roll.pipeline.rlvr.rewards.detection_reward_worker.DetectionRewardWorker
    model_args:
      model_name_or_path: ${reward_pretrain}
    tag_included: [v3det_train, object365_train, coco_val_multi_test]
    world_size: 16
    infer_batch_size: 1
