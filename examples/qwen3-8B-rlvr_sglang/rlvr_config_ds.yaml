# ---------- rlvr_config_ds_lora.yaml ----------
# ① 继承 DeepSpeed 预设
defaults:
  - ../config/deepspeed_zero@_here_
  - ../config/deepspeed_zero2@_here_
  - ../config/deepspeed_zero3@_here_
  - ../config/deepspeed_zero3_cpuoffload@_here_

hydra:
  run:
    dir: .
  output_subdir: null

# ========= 基础信息 =========
exp_name: "qwen3-8B-rlvr-llmjudge-h800-8gpu"
seed: 42
logging_dir: /project/hdtaccuracy/trains/grpo/qwen3_8b/logs
output_dir: /project/hdtaccuracy/trains/grpo/qwen3_8b/output
num_gpus_per_node: 8      # 8×H800

track_with: wandb
tracker_kwargs:
 api_key: dce12064d30900b2cc538f73e82997de5aafbb96
 project: roll_peralign
 notes: roll_peralign
 tags:
   - rlvr
   - baseline
  
# ========= 训练控制 =========
max_steps: 1000
save_steps: 100
logging_steps: 1
eval_steps: 50
resume_from_checkpoint: false

# ========= RL 超参 =========
rollout_batch_size: 32
prompt_length: 7000
response_length: 512
num_return_sequences_in_group: 8
ppo_epochs: 1
adv_estimator: "reinforce"
value_clip: 0.5
reward_clip: 10
whiten_advantages: true

# ========= 预训练权重 =========
pretrain: /project/hdtaccuracy/models/base/Qwen3-8B
reward_pretrain: /project/hdtaccuracy/models/base/Qwen3-8B            # critic 初始权重

# ========= Actor（训练） =========
actor_train:
  model_args:
    dtype: bf16
    disable_gradient_checkpointing: false
    # —— LoRA 超参 ——                                   # 可按需微调
    lora_rank: 8
    lora_target: all          # 只插注意力可写 "q_proj,v_proj"
    lora_alpha: 32
    lora_dropout: 0.05
  training_args:
    learning_rate: 1.0e-4     # LoRA 常用 1e-4–1e-3
    weight_decay: 0.0
    per_device_train_batch_size: 2   # ZeRO-3 显存足够可翻倍
    gradient_accumulation_steps: 16  # 2×16 ≈ 原来 1×32
    warmup_steps: 200
    num_train_epochs: 3
  data_args:
    template: qwen3_nothink
    file_name:
      - /project/hdtaccuracy/Personality-Alignment/split_data_v6_roll/train_user_based.jsonl
    dataset_dir: data
    messages: prompt
  strategy_args:
    strategy_name: deepspeed_train         # ← 从 megatron_train 改成 DS
    strategy_config: ${deepspeed_zero2}    # 引用上面的 DS 预设
  device_mapping: "[0, 1, 2, 3]"             # 与原先保持一致
  infer_batch_size: 2

# ========= Actor（推理/采样） =========
actor_infer:
  model_args:
    dtype: bf16
    disable_gradient_checkpointing: true
  generating_args:
    max_new_tokens: 512
    top_p: 0.95
    top_k: 100
    num_beams: 1
    temperature: 0.95
    num_return_sequences: ${num_return_sequences_in_group}
  data_args:
    template: qwen3_nothink
  strategy_args:
    strategy_name: sglang
    strategy_config:
      mem_fraction_static: 0.7
  num_gpus_per_worker: 1
  device_mapping: "[4]"                     # GPU4
  infer_batch_size: 1

# ========= Reference =========
reference:
  model_args:
    dtype: bf16
    disable_gradient_checkpointing: true
  data_args:
    template: qwen3_nothink
  strategy_args:
    strategy_name: megatron_infer
    strategy_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
  device_mapping: "[5]"                    # GPU5
  infer_batch_size: 1

# ========= Reward =========
rewards:
  llm_judge:
    worker_cls: roll.pipeline.rlvr.rewards.llm_judge_reward_worker.PerAlignLLMJudgeRewardWorker
    judge_prompt: PERALIGN-RLVR-prompt
    judge_model_type: inference
    tag_included: [RLVR]
    model_args:
      model_name_or_path: /project/hdtaccuracy/models/base/Qwen3-8B            # critic 初始权重
      dtype: bf16
      attn_implementation: fa2
      disable_gradient_checkpointing: true
    generating_args:
      max_new_tokens: 512
      top_p: 0.8
      top_k: 50
      temperature: 0.8
      num_beams: 1
      num_return_sequences: 1
    data_args:
      template: qwen3_nothink
    strategy_args:
      strategy_name: hf_infer
    device_mapping: "[6, 7]"                # GPU6‑7，独立占用
    world_size: 2
    infer_batch_size: 4
