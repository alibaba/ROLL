# LoRA engineering candidate; real TP1/EP8 capacity and full acceptance are pending.
hydra:
  run:
    dir: .
  output_subdir: null

exp_name: ${oc.env:ROLL_EXPERIMENT_NAME,qwen38-lora-sft-8k}
seed: 42
logging_dir: ./output/logs
output_dir: ${oc.env:ROLL_OUTPUT_DIR,./output/qwen38-lora-sft-8k}
pretrain: ${oc.env:MODEL_PATH}
track_with: stdout
num_gpus_per_node: 8
# Include model save and storage upload in the worker RPC budget.
rpc_timeout: 14400
max_steps: 100
save_steps: 50
eval_steps: 50
logging_steps: 1
resume_from_checkpoint: false
sequence_length: ${oc.decode:${oc.env:ROLL_SEQUENCE_LENGTH,8192}}
prompt_key: instruction
response_key: output
global_template: native_nonthinking

system_envs:
  # QSA FlexAttention requires its compiled forward/backward kernel.
  TORCH_COMPILE_DISABLE: '0'
  NVTE_TORCH_COMPILE: '0'
  TOKENIZERS_PARALLELISM: 'false'
  CUDA_DEVICE_MAX_CONNECTIONS: '1'
  PYTORCH_CUDA_ALLOC_CONF: 'expandable_segments:True'
  OMP_NUM_THREADS: '2'

validation:
  data_args:
    file_name: ${oc.env:ROLL_SFT_HELDOUT,output/sft-validation-data-v2/heldout.jsonl}
    template: native_nonthinking

sft_train:
  model_args:
    dtype: bf16
    attn_implementation: sdpa
    flash_attn: sdpa
    lora_rank: 64
    lora_alpha: 128
    lora_dropout: 0.0
    autocast_adapter_dtype: false
    lora_target: '.*\.(linear_qkv|linear_proj|in_proj|out_proj|linear_fc1|linear_fc2|key_proj|value_proj|index_qk_proj|input_mix_weight_down|input_mix_weight_up|block_inject_weight)$'
  training_args:
    # 400 examples / DP8 * 2 epochs = 100 optimizer steps.
    num_train_epochs: 2
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 1
    learning_rate: 1.0e-5
    lr_scheduler_type: constant
    warmup_steps: 0
    weight_decay: 0.0
  data_args:
    file_name: ${oc.env:ROLL_SFT_TRAIN_DATA,output/sft-validation-data-v2/train-8k.jsonl}
    template: native_nonthinking
    preprocessing_num_workers: 1
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      # TP=ETP=1 keeps the supported legacy LoRA checkpoint layout.
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 8
      expert_tensor_parallel_size: 1
      sequence_parallel: false
      moe_grouped_gemm: true
      moe_token_dispatcher_type: alltoall
      use_distributed_optimizer: true
      accumulate_allreduce_grads_in_fp32: false
      optimizer_cpu_offload: true
      optimizer_offload_fraction: 1.0
      use_precision_aware_optimizer: true
      overlap_cpu_optimizer_d2h_h2d: true
      bounded_cpu_grad_staging: true
      bf16: true
      save_only_model: false
      ckpt_format: legacy
      additional_configs:
        perform_initialization: false
        gradient_accumulation_fusion: false
        recompute_granularity: full
        recompute_method: uniform
        recompute_num_layers: 1
        checkpoint_cpu_offload: true
        vocab_loss_chunk_size: 256
        qsa_indexer_kl_coef: 0.01
  use_sequence_packing: false
  use_remove_padding: false
  device_mapping: list(range(0,8))
  infer_batch_size: 1
